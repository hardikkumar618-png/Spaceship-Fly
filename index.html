<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = Math.min(innerWidth, 480);
  canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

/* ========= AUDIO ========= */
const AC = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AC();
const sound = (f,d,t="sine",v=.15)=>{
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=t;o.frequency.value=f;g.gain.value=v;
  o.connect(g).connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+d);
};

/* ========= GAME BASE ========= */
let insaneMode = false;
let state = "start";
let score = 0;
let shakeTime = 0;
let shakeStrength = 0;

const HS = {
  normal: +localStorage.getItem("hs_normal") || 0,
  insane: +localStorage.getItem("hs_insane") || 0
};

let gravity, boost, gap, speed;

/* ========= SHIP ========= */
const shipImg = new Image();
shipImg.src = "YOUR_SPACESHIP_IMAGE_HERE.png";

const ship = { x:0,y:0,w:64,h:40,vy:0 };

function resetShip(){
  ship.x = canvas.width*0.25;
  ship.y = canvas.height/2;
  ship.vy = 0;
}

/* ========= PIPES ========= */
let pipes=[];
const PIPE_W=60;

function spawnPipe(x){
  pipes.push({
    x,
    gapY: Math.random()*(canvas.height-gap-160)+80,
    scored:false
  });
}
function resetPipes(){
  pipes=[];
  for(let i=0;i<4;i++) spawnPipe(canvas.width+i*200);
}

/* ========= INPUT ========= */
canvas.addEventListener("pointerdown",()=>{
  audioCtx.resume();
  if(state==="start") startGame();
  else if(state==="playing"){
    ship.vy=boost;
    sound(600,.1,"square");
  }
});

/* ========= FLOW ========= */
function startGame(){
  score=0;
  gravity = insaneMode ? 0.6 : 0.45;
  boost   = insaneMode ? -7.0 : -7.5;
  gap     = insaneMode ? 120 : 160;
  speed   = insaneMode ? 3.2 : 2.6;
  resetShip(); resetPipes();
  state="playing";
}

function crash(){
  if(state!=="playing") return;
  state="gameover";
  shakeTime=20;
  shakeStrength=12;
  sound(160,.4,"sawtooth",.2);
  const key = insaneMode ? "insane":"normal";
  HS[key]=Math.max(HS[key],score);
  localStorage.setItem("hs_"+key,HS[key]);
}

/* ========= UPDATE ========= */
function update(){
  ship.vy+=gravity;
  ship.y+=ship.vy;

  if(ship.y<0||ship.y+ship.h>canvas.height) crash();

  for(const p of pipes){
    p.x-=speed;
    if(!p.scored && p.x+PIPE_W<ship.x){
      p.scored=true;
      score++;
      sound(900,.1,"triangle");

      speed*=insaneMode?1.07:1.04;
      gravity+=insaneMode?.03:.015;
      boost-=insaneMode?.08:.05;
      gap=Math.max(insaneMode?90:110,gap-(insaneMode?6:4));
    }

    if(ship.x+ship.w>p.x&&ship.x<p.x+PIPE_W &&
      (ship.y<p.gapY||ship.y+ship.h>p.gapY+gap)) crash();
  }

  if(pipes[0].x+PIPE_W<0){
    pipes.shift();
    spawnPipe(pipes[pipes.length-1].x+180);
  }
}

/* ========= DRAW ========= */
function draw(){
  let sx=0,sy=0;
  if(shakeTime>0){
    shakeTime--;
    sx=(Math.random()-.5)*shakeStrength;
    sy=(Math.random()-.5)*shakeStrength;
  }

  ctx.setTransform(1,0,0,1,sx,sy);
  ctx.clearRect(-50,-50,canvas.width+100,canvas.height+100);

  if(insaneMode){
    ctx.fillStyle="rgba(255,0,0,.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  ctx.fillStyle="#3cff7a";
  pipes.forEach(p=>{
    ctx.fillRect(p.x,0,PIPE_W,p.gapY);
    ctx.fillRect(p.x,p.gapY+gap,PIPE_W,canvas.height);
  });

  ctx.save();
  ctx.translate(ship.x+ship.w/2,ship.y+ship.h/2);
  ctx.rotate(Math.max(-.6,Math.min(.6,ship.vy/10)));
  ctx.drawImage(shipImg,-ship.w/2,-ship.h/2,ship.w,ship.h);
  ctx.restore();

  ctx.fillStyle="#fff";
  ctx.font="bold 20px sans-serif";
  ctx.textAlign="center";
  ctx.fillText(score,canvas.width/2,40);

  if(state==="start"){
    ctx.font="bold 24px sans-serif";
    ctx.fillText("Flappy Spaceship",canvas.width/2,canvas.height/2-30);
    ctx.font="16px sans-serif";
    ctx.fillText("Tap to Start",canvas.width/2,canvas.height/2+10);
    ctx.fillText("INSANE MODE",canvas.width/2,canvas.height/2+60);
  }

  if(state==="gameover"){
    ctx.fillStyle="rgba(0,0,0,.6)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#ff6b6b";
    ctx.font="14px sans-serif";
    ctx.fillText("BSS BSDK HO GYA OUT, BKL SAALA EK GAME NHI KHEL PAA RHA H!",canvas.width/2,canvas.height/2-80);
    ctx.font="20px sans-serif";
    ctx.fillText(`High Score: ${insaneMode?HS.insane:HS.normal}`,canvas.width/2,canvas.height/2);
    ctx.font="12px sans-serif";
    ctx.fillText("Made by HKP",canvas.width/2,canvas.height/2+60);
  }

  ctx.setTransform(1,0,0,1,0,0);
}

/* ========= LOOP ========= */
function loop(){
  if(state==="playing") update();
  draw();
  requestAnimationFrame(loop);
}
loop();

/* INSANE MODE TOGGLE */
canvas.addEventListener("dblclick",()=>{
  if(state==="start") insaneMode=!insaneMode;
});
</script>
